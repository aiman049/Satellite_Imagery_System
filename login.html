<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatelliteIDB — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #050c14;
    --panel:    #0a1628;
    --border:   #1a3a5c;
    --accent:   #00d4ff;
    --accent2:  #0077ff;
    --text:     #c8dff0;
    --muted:    #4a6a8a;
    --error:    #ff4466;
    --success:  #00ffaa;
  }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* animated star background */
  .stars { position: fixed; inset: 0; z-index: 0; }
  .stars::before, .stars::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 45%, #ffffff33 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 20%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 60%, #ffffff22 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 35%, #ffffff55 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 80%, #ffffff33 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 70%, #ffffff44 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 90%, #ffffff22 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 10%, #ffffff55 0%, transparent 100%);
  }
  .stars::after { transform: rotate(90deg); opacity: 0.6; }

  /* orbit ring decoration */
  .orbit-ring {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(0,212,255,0.06);
    animation: spin linear infinite;
  }
  .orbit-ring:nth-child(1) { width: 700px; height: 700px; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-duration: 60s; }
  .orbit-ring:nth-child(2) { width: 1000px; height: 1000px; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-duration: 90s; animation-direction: reverse; }
  .orbit-ring:nth-child(3) { width: 1300px; height: 1300px; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-duration: 120s; }
  @keyframes spin { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }

  /* satellite dot on ring */
  .orbit-ring:nth-child(1)::after {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    top: -4px; left: 50%;
    box-shadow: 0 0 12px var(--accent);
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }

  .logo-area {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.6s ease;
  }
  .logo-icon {
    font-size: 48px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px var(--accent));
  }
  .logo-title {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(0,212,255,0.5);
  }
  .logo-sub {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 36px;
    box-shadow: 0 0 60px rgba(0,100,200,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    animation: fadeUp 0.6s ease 0.1s both;
  }

  /* corner decorations */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border-color: var(--accent);
    border-style: solid;
  }
  .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .tabs {
    display: flex;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }

  .form-section { display: none; }
  .form-section.active { display: block; }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .field input, .field select {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
  }
  .field select option { background: #0a1628; }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 2px;
    color: #000;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .message {
    padding: 10px 14px;
    border-radius: 2px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
    letter-spacing: 0.5px;
  }
  .message.error   { background: rgba(255,68,102,0.1); border: 1px solid var(--error);   color: var(--error);   display: block; }
  .message.success { background: rgba(0,255,170,0.1);  border: 1px solid var(--success);  color: var(--success); display: block; }

  .hint {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .hint span { color: var(--accent); cursor: pointer; }
  .hint span:hover { text-decoration: underline; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:none; } }
</style>
</head>
<body>

<div class="stars"></div>
<div class="orbit-ring"></div>
<div class="orbit-ring"></div>
<div class="orbit-ring"></div>

<div class="container">
  <div class="logo-area">
    <div class="logo-icon">🛰️</div>
    <div class="logo-title">SatelliteIDB</div>
    <div class="logo-sub">Imagery Database System</div>
  </div>

  <div class="card" style="position:relative;">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-section active" id="loginSection">
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">Access System</button>
      <div class="message" id="loginMsg"></div>
    </div>

    <!-- REGISTER FORM -->
    <div class="form-section" id="registerSection">
      <div class="field">
        <label>Username</label>
        <input type="text" id="regUser" placeholder="Choose a username">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="your@email.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="Min. 4 characters">
      </div>
      <div class="field">
        <label>Role</label>
        <select id="regRole">
          <option value="viewer">Viewer — Browse images</option>
          <option value="analyst">Analyst — View & analyse</option>
          <option value="admin">Admin — Full access</option>
        </select>
      </div>
      <button class="btn" id="regBtn" onclick="doRegister()">Create Account</button>
      <div class="message" id="regMsg"></div>
    </div>
  </div>
</div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (tab==='login')));
    document.getElementById('loginSection').classList.toggle('active', tab === 'login');
    document.getElementById('registerSection').classList.toggle('active', tab === 'register');
    document.getElementById('loginMsg').className = 'message';
    document.getElementById('regMsg').className = 'message';
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'message ' + type;
  }

  async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    if (!username || !password) { showMsg('loginMsg','Please fill all fields','error'); return; }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Authenticating...';

    try {
      const res  = await fetch('auth/login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('sat_user',     data.username);
        localStorage.setItem('sat_role',     data.role);
        localStorage.setItem('sat_user_id',  data.user_id);
        showMsg('loginMsg', '✓ Access granted. Redirecting...', 'success');
        setTimeout(() => window.location.href = 'gallery.html', 800);
      } else {
        showMsg('loginMsg', data.error || 'Login failed', 'error');
        btn.disabled = false; btn.textContent = 'Access System';
      }
    } catch(e) {
      showMsg('loginMsg', 'Server error. Is XAMPP running?', 'error');
      btn.disabled = false; btn.textContent = 'Access System';
    }
  }

  async function doRegister() {
    const username = document.getElementById('regUser').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value.trim();
    const role     = document.getElementById('regRole').value;

    if (!username || !email || !password) { showMsg('regMsg','Please fill all fields','error'); return; }

    const btn = document.getElementById('regBtn');
    btn.disabled = true; btn.textContent = 'Creating Account...';

    try {
      const res  = await fetch('auth/register.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password, role })
      });
      const data = await res.json();
      if (data.success) {
        showMsg('regMsg', '✓ Account created! Please log in.', 'success');
        setTimeout(() => switchTab('login'), 1500);
      } else {
        showMsg('regMsg', data.error || 'Registration failed', 'error');
      }
      btn.disabled = false; btn.textContent = 'Create Account';
    } catch(e) {
      showMsg('regMsg', 'Server error. Is XAMPP running?', 'error');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('loginSection').classList.contains('active')) doLogin();
      else doRegister();
    }
  });

  // Redirect if already logged in
  if (localStorage.getItem('sat_user')) window.location.href = 'gallery.html';
</script>
</body>
</html>
