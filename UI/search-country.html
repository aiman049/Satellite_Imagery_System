<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Satellite Imagery Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    
    <link rel="stylesheet" href="explore_data.css">
    <link rel="stylesheet" href="search-country.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">A PROJECT BY <span>'WAN'</span></div>
            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="form.html">Login</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <main class="left-panel">
            <header>
                <h1>Geo-Satellite Imagery</h1>
                <p>Explore Earth Satellite Imagery Data for observation.</p>
            </header>

            <div class="search-controls">
                <label for="countrySelect" class="visually-hidden">Select a Country</label>
                <select id="countrySelect" class="input-box">
                    <option value="">Select Country...</option>
                    <option value="Pakistan">Pakistan</option>
                    <option value="Turkey">Turkey</option>
                    <option value="USA">USA</option>
                    <option value="Japan">Japan</option>
                    <option value="China">China</option>
                    <option value="Brazil">Brazil</option>
                    <option value="Australia">Australia</option>
                </select>
                </select>

                <button class="btn btn-primary" onclick="submitCountry()">
                    Search Region
                </button>
            </div>

            <footer>
                <p>A Project by 'WAN'_2026</p>
            </footer>
        </main>

        <div class="right-panel">
            <div id="globeViz"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
