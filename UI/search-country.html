<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Satellite Imagery Portal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <link rel="stylesheet" href="search-country.css">
</head>

<body>

    <nav>
        <div class="nav-container">
            <div class="logo">A PROJECT BY <span>'WAN'</span></div>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <span id="navUser" class="nav-user-pill"></span>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <main class="left-panel">
            <header>
                <h1>Geo-Satellite Imagery</h1>
                <p>Explore Earth Satellite Imagery Data for observation.</p>
            </header>

            <div class="search-controls">
                <label for="countrySelect" class="visually-hidden">Select a Country</label>
                <select id="countrySelect" class="input-box">
                    <option value="">Select Country...</option>
                </select>

                <button class="btn btn-primary" onclick="submitCountry()">
                    Search Region
                </button>
            </div>

            <footer>
                <p>A Project by 'WAN'_2026</p>
            </footer>
        </main>

        <div class="right-panel">
            <div id="globeViz"></div>
        </div>
    </div>

    <script>
        // Auth guard
        if (!localStorage.getItem('wan_logged_in')) {
            window.location.href = 'register.html';
        }
        // Show logged in user
        const _u = localStorage.getItem('wan_user');
        if (_u) {
            const u = JSON.parse(_u);
            const pill = document.getElementById('navUser');
            if (pill) pill.textContent = '👤 ' + (u.username || u.email || '');
        }
        function logout() {
            localStorage.removeItem('wan_logged_in');
            localStorage.removeItem('wan_user');
            window.location.href = 'register.html';
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
