<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geo-Satellite Imagery Portal</title>
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="explore_data.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo">A PROJECT BY <span>'WAN'</span></div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="explore_data.html" class="active">Explore Data</a>
      <a href="form.html">Login</a>
    </div>
  </nav>

  <!-- MAIN LAYOUT -->
  <div class="container">

    <!-- LEFT PANEL -->
    <main class="left-panel">

      <header>
        <h1>Geo-Satellite Imagery</h1>
        <p>Explore Earth Satellite Imagery Data for observation.</p>
      </header>

      <div class="search-controls">
        <label class="visually-hidden" for="countrySelect">Select Country</label>
        <select id="countrySelect" class="input-box">
          <option value="">Select Country...</option>
        </select>

        <button class="btn btn-primary" onclick="goToResults()">
          Search Region
        </button>
      </div>

      <footer>
        <p>A Project by 'WAN'_2026</p>
      </footer>

    </main>

    <!-- RIGHT PANEL — GLOBE -->
    <div class="right-panel">
      <div id="globeViz"></div>
    </div>

  </div>

  <script>
    const BASE = '../Php';

    // ── Load countries from DB into dropdown ─────────────────
    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${BASE}/phpget_countries.php`)
        .then(r => r.json())
        .then(countries => {
          const select = document.getElementById('countrySelect');
          countries.forEach(c => {
            const opt       = document.createElement('option');
            opt.value       = c.Country_ID;
            opt.dataset.name = c.Country_Name;
            opt.textContent = c.Country_Name;
            select.appendChild(opt);
          });
        })
        .catch(() => {
          alert('Could not load countries. Make sure XAMPP is running.');
        });
    });

    // ── On Search button click → go to results page ──────────
    function goToResults() {
      const select      = document.getElementById('countrySelect');
      const countryId   = select.value;
      const countryName = select.options[select.selectedIndex]?.dataset.name || '';

      if (!countryId) {
        alert('Please select a country first.');
        return;
      }

      // Pass country info to results page via URL
      window.location.href = `results.html?country_id=${countryId}&country=${encodeURIComponent(countryName)}`;
    }

    // ── Globe setup ──────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      const globe = Globe()
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .width(document.getElementById('globeViz').offsetWidth)
        .height(window.innerHeight)(document.getElementById('globeViz'));

      globe.controls().autoRotate      = true;
      globe.controls().autoRotateSpeed = 0.6;
      globe.controls().enableZoom      = true;
    });
  </script>

</body>
</html>
