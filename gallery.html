<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatelliteIDB — Image Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #050c14;
    --panel:   #0a1628;
    --panel2:  #0d1f35;
    --border:  #1a3a5c;
    --accent:  #00d4ff;
    --accent2: #0077ff;
    --text:    #c8dff0;
    --muted:   #4a6a8a;
    --error:   #ff4466;
    --success: #00ffaa;
  }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── NAVBAR ── */
  .navbar {
    background: rgba(10,22,40,0.95);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .nav-brand {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-brand span { font-size: 20px; }
  .nav-user {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
  }
  .user-badge {
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    padding: 4px 12px;
    border-radius: 2px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .role-badge {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 3px 8px;
    border-radius: 2px;
    text-transform: uppercase;
  }
  .role-admin   { background: rgba(255,68,102,0.15); border: 1px solid #ff4466; color: #ff4466; }
  .role-analyst { background: rgba(0,212,255,0.15);  border: 1px solid var(--accent); color: var(--accent); }
  .role-viewer  { background: rgba(0,255,170,0.15);  border: 1px solid var(--success); color: var(--success); }
  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    transition: all 0.2s;
    border-radius: 2px;
  }
  .btn-logout:hover { border-color: var(--error); color: var(--error); }

  /* ── LAYOUT ── */
  .layout { display: flex; min-height: calc(100vh - 60px); }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  .sidebar-title {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .filter-group { margin-bottom: 20px; }
  .filter-group label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .filter-group select,
  .filter-group input {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 8px 10px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .filter-group select:focus,
  .filter-group input:focus { border-color: var(--accent); }
  .filter-group select option { background: #0a1628; }

  .btn-filter {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 2px;
    color: #000;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity 0.2s;
  }
  .btn-filter:hover { opacity: 0.85; }

  .btn-reset {
    width: 100%;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .btn-reset:hover { border-color: var(--text); color: var(--text); }

  /* stats */
  .stat-box {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 12px;
    margin-top: 20px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    color: var(--accent);
    font-weight: 700;
  }
  .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }

  /* ── MAIN CONTENT ── */
  .main { flex: 1; padding: 24px; overflow-y: auto; }

  .search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    align-items: center;
  }
  .search-bar input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 11px 16px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }
  .view-toggle { display: flex; gap: 4px; }
  .view-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 14px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .view-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.1); }

  /* ── GRID ── */
  #gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  #gallery.list-view {
    grid-template-columns: 1fr;
  }

  .img-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    animation: cardIn 0.3s ease both;
  }
  .img-card:hover {
    transform: translateY(-3px);
    border-color: rgba(0,212,255,0.5);
    box-shadow: 0 8px 30px rgba(0,100,200,0.2);
  }
  @keyframes cardIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  .card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    background: #0d1f35;
  }
  .card-img-placeholder {
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, #0d1f35, #152d4a);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 32px;
    gap: 8px;
  }
  .card-img-placeholder span { font-size: 12px; letter-spacing: 1px; }

  .card-body { padding: 14px; }
  .card-location {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .tag {
    font-size: 10px;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 2px;
    text-transform: uppercase;
  }
  .tag-terrain { background: rgba(0,119,255,0.15); border: 1px solid rgba(0,119,255,0.4); color: #6ab4ff; }
  .tag-country { background: rgba(0,212,255,0.1);  border: 1px solid rgba(0,212,255,0.3); color: var(--accent); }
  .tag-year    { background: rgba(0,255,170,0.1);  border: 1px solid rgba(0,255,170,0.3); color: var(--success); }
  .card-sat { font-size: 12px; color: var(--muted); letter-spacing: 0.5px; }

  /* list view card */
  #gallery.list-view .img-card { display: flex; }
  #gallery.list-view .card-img,
  #gallery.list-view .card-img-placeholder { width: 160px; height: 120px; flex-shrink: 0; }
  #gallery.list-view .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  /* empty / loading states */
  .state-msg {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .state-msg .icon { font-size: 48px; margin-bottom: 16px; }
  .state-msg p { font-size: 16px; letter-spacing: 1px; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    max-width: 820px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: modalIn 0.2s ease;
    position: relative;
  }
  @keyframes modalIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:none; } }

  .modal-close {
    position: absolute;
    top: 14px; right: 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 32px; height: 32px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    z-index: 1;
  }
  .modal-close:hover { border-color: var(--error); color: var(--error); }

  .modal-img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    display: block;
  }
  .modal-body { padding: 24px; }
  .modal-title {
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .detail-item label {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .detail-item value {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }
  .modal-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 4px;
  }
  .coords {
    font-family: monospace;
    font-size: 12px;
    color: var(--accent);
    background: rgba(0,0,0,0.3);
    padding: 6px 10px;
    border-radius: 2px;
    display: inline-block;
    margin-top: 12px;
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-brand"><span>🛰️</span> SatelliteIDB</div>
  <div class="nav-user">
    <div class="user-badge" id="userBadge">—</div>
    <div class="role-badge" id="roleBadge">—</div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="layout">

  <!-- SIDEBAR FILTERS -->
  <aside class="sidebar">
    <div class="sidebar-title">🔍 Filters</div>

    <div class="filter-group">
      <label>Country</label>
      <select id="filterCountry">
        <option value="">All Countries</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Terrain Type</label>
      <select id="filterTerrain">
        <option value="">All Terrains</option>
        <option value="Urban">Urban</option>
        <option value="Desert">Desert</option>
        <option value="Forest">Forest</option>
        <option value="Mountain">Mountain</option>
        <option value="Coastal">Coastal</option>
        <option value="Agricultural">Agricultural</option>
        <option value="Wetland">Wetland</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Capture Year</label>
      <select id="filterYear">
        <option value="">All Years</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
      </select>
    </div>

    <button class="btn-filter" onclick="applyFilters()">Apply Filters</button>
    <button class="btn-reset"  onclick="resetFilters()">Reset</button>

    <div class="stat-box">
      <div class="stat-num" id="imageCount">—</div>
      <div class="stat-label">Images Shown</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔎  Search locations, descriptions, countries..." oninput="debounceSearch()">
      <div class="view-toggle">
        <button class="view-btn active" id="gridBtn" onclick="setView('grid')" title="Grid view">⊞</button>
        <button class="view-btn"        id="listBtn" onclick="setView('list')" title="List view">☰</button>
      </div>
    </div>

    <div id="gallery">
      <div class="state-msg">
        <div class="icon">🛰️</div>
        <p>Loading satellite imagery...</p>
      </div>
    </div>
  </main>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <img class="modal-img" id="modalImg" src="" alt="" onerror="this.style.display='none'">
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="detail-grid" id="modalGrid"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="coords" id="modalCoords"></div>
    </div>
  </div>
</div>

<script>
  // ── AUTH GUARD ──
  const SAT_USER = localStorage.getItem('sat_user');
  const SAT_ROLE = localStorage.getItem('sat_role');
  if (!SAT_USER) window.location.href = 'login.html';

  document.getElementById('userBadge').textContent = SAT_USER;
  const rb = document.getElementById('roleBadge');
  rb.textContent = SAT_ROLE;
  rb.className = 'role-badge role-' + SAT_ROLE;

  // ── LOAD COUNTRIES ──
  async function loadCountries() {
    try {
      const res  = await fetch('api/get_countries.php');
      const data = await res.json();
      if (!data.success) return;
      const sel = document.getElementById('filterCountry');
      data.data.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.Country_ID;
        opt.textContent = c.Country_Name + ' (' + c.Continent_Name + ')';
        sel.appendChild(opt);
      });
    } catch(e) { console.error(e); }
  }

  // ── LOAD IMAGES ──
  async function loadImages(params = {}) {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '<div class="state-msg"><div class="icon">⏳</div><p>Loading...</p></div>';

    const qs = new URLSearchParams();
    if (params.country_id)   qs.set('country_id',   params.country_id);
    if (params.terrain_type) qs.set('terrain_type', params.terrain_type);
    if (params.year)         qs.set('year',         params.year);
    if (params.search)       qs.set('search',       params.search);

    try {
      const res  = await fetch('api/get_images.php?' + qs.toString());
      const data = await res.json();

      document.getElementById('imageCount').textContent = data.count || 0;

      if (!data.success || !data.data.length) {
        gallery.innerHTML = '<div class="state-msg"><div class="icon">🔭</div><p>No images found for these filters.</p></div>';
        return;
      }

      gallery.innerHTML = '';
      data.data.forEach((img, i) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.style.animationDelay = Math.min(i * 40, 400) + 'ms';
        card.onclick = () => openModal(img);

        const imgHtml = `<img class="card-img" src="${img.Image_Path}" alt="${img.Loc_Name}"
          onerror="this.outerHTML='<div class=\\'card-img-placeholder\\'><span>🛰️</span><span>No Preview</span></div>'">`;

        card.innerHTML = `
          ${imgHtml}
          <div class="card-body">
            <div class="card-location">${img.Loc_Name}</div>
            <div class="card-meta">
              <span class="tag tag-country">${img.Country_Name}</span>
              <span class="tag tag-terrain">${img.Terrain_Type}</span>
              <span class="tag tag-year">${img.Capture_Year}</span>
            </div>
            <div class="card-sat">🛰 ${img.Sat_Name} · ${img.Orbit}</div>
          </div>`;
        gallery.appendChild(card);
      });
    } catch(e) {
      gallery.innerHTML = '<div class="state-msg"><div class="icon">⚠️</div><p>Error loading images. Is the server running?</p></div>';
      console.error(e);
    }
  }

  // ── FILTERS ──
  function applyFilters() {
    loadImages({
      country_id:   document.getElementById('filterCountry').value,
      terrain_type: document.getElementById('filterTerrain').value,
      year:         document.getElementById('filterYear').value,
      search:       document.getElementById('searchInput').value.trim()
    });
  }

  function resetFilters() {
    document.getElementById('filterCountry').value = '';
    document.getElementById('filterTerrain').value = '';
    document.getElementById('filterYear').value    = '';
    document.getElementById('searchInput').value   = '';
    loadImages();
  }

  let searchTimer;
  function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      loadImages({ search: document.getElementById('searchInput').value.trim() });
    }, 400);
  }

  // ── VIEW TOGGLE ──
  function setView(v) {
    document.getElementById('gallery').className = v === 'list' ? 'list-view' : '';
    document.getElementById('gridBtn').classList.toggle('active', v === 'grid');
    document.getElementById('listBtn').classList.toggle('active', v === 'list');
  }

  // ── MODAL ──
  function openModal(img) {
    document.getElementById('modalImg').src   = img.Image_Path;
    document.getElementById('modalImg').alt   = img.Loc_Name;
    document.getElementById('modalTitle').textContent = img.Loc_Name;

    document.getElementById('modalGrid').innerHTML = `
      <div class="detail-item"><label>Country</label><value>${img.Country_Name}</value></div>
      <div class="detail-item"><label>Continent</label><value>${img.Continent_Name}</value></div>
      <div class="detail-item"><label>Terrain</label><value>${img.Terrain_Type}</value></div>
      <div class="detail-item"><label>Capture Year</label><value>${img.Capture_Year}</value></div>
      <div class="detail-item"><label>Satellite</label><value>${img.Sat_Name}</value></div>
      <div class="detail-item"><label>Orbit Type</label><value>${img.Orbit}</value></div>
      <div class="detail-item"><label>Sensor Model</label><value>${img.Sat_Model}</value></div>
      <div class="detail-item"><label>Launch Year</label><value>${img.Sat_LaunchYear}</value></div>
    `;

    document.getElementById('modalDesc').textContent  = img.Description || 'No description available.';
    document.getElementById('modalCoords').textContent = `📍 ${img.Latitude}°, ${img.Longitude}°`;
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
  }
  function closeModalDirect() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

  // ── LOGOUT ──
  async function logout() {
    try { await fetch('auth/logout.php'); } catch(e) {}
    localStorage.clear();
    window.location.href = 'login.html';
  }

  // ── INIT ──
  loadCountries();
  loadImages();
</script>
</body>
</html>
